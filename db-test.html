<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Abide Database Test</title>
</head>
<body>
  <h2>Abide 2.0 Database Test</h2>
  <p id="status">Checking browser support...</p>

  <script>
    const status = document.getElementById("status");

    if (!("indexedDB" in window)) {
      status.textContent = "FAILED: IndexedDB is not supported.";
    } else {
      const request = indexedDB.open("abide-test-isolated", 1);

      request.onupgradeneeded = () => {
        request.result.createObjectStore("testRecords", {
          keyPath: "id"
        });
      };

      request.onsuccess = () => {
        const db = request.result;
        const tx = db.transaction("testRecords", "readwrite");

        tx.objectStore("testRecords").put({
          id: "test-1",
          message: "Abide database test passed"
        });

        tx.oncomplete = () => {
          status.textContent =
            "SUCCESS: Database created and test record saved.";
          db.close();
        };
      };

      request.onerror = () => {
        status.textContent = "FAILED: " + request.error;
      };
    }
  </script>
</body>
</html>
