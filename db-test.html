<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Abide Database Test</title>
</head>
<body>
  <h2>Abide 2.0 Database Test</h2>
  <p id="status">Loading Abide database...</p>

  <script src="./db.js"></script>

  <script>
    const status = document.getElementById("status");

    async function testDatabase() {
      try {
        const db = await window.AbideDB.open();

        const expected = [
          "appMeta",
          "prayerSchedules",
          "prayerSessions",
          "legacyCheckins",
          "journals",
          "prayerRequests",
          "propheticWords",
          "playlists",
          "audioLibrary",
          "settings",
          "migrationArchive"
        ];

        const missing = expected.filter(
          name => !db.objectStoreNames.contains(name)
        );

        if (missing.length > 0) {
          status.textContent = "FAILED: Missing stores: " + missing.join(", ");
        } else {
          status.textContent =
            "SUCCESS: All 11 Abide database stores created correctly.";
        }

        db.close();
      } catch (error) {
        status.textContent = "FAILED: " + error.message;
      }
    }

    testDatabase();
  </script>
</body>
</html>
