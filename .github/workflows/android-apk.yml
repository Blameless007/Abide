
name: Build Abide Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build installable APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out Abide
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare app files
        run: |
          mkdir -p www
          cp index.html styles.css redesign.css prayer-controls.css audio.css records.css db.js daily-content.js app.js audio.js records.js manifest.webmanifest icon.svg sw.js www/

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Abide
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Abide-Android.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Abide-Android-APK
          path: Abide-Android.apk
          if-no-files-found: error
          retention-days: 30
